name: Deploy browser runtime to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'browser_runtime/**'
      - 'minigames/**'
      - 'ballattax/**'
      - 'test/**'
      - 'ide/**'
      - 'serviceworker.js'
      - 'arcamini_api.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage site
        # browser_runtime/index.html links to sibling example directories via
        # ?game=../minigames/ style query params (see browser_runtime/index.html),
        # so those directories need to be servable alongside browser_runtime/
        # itself. ide/ needs the same siblings plus the root-scoped
        # serviceworker.js (its scope has to cover both ide/ and
        # browser_runtime/, so it can't live inside ide/ -- see
        # serviceworker.js) and arcamini_api.md (linked from the IDE sidebar).
        # Staged explicitly rather than uploading the whole checkout so .git
        # and unrelated repo files never end up published.
        run: |
          mkdir _site
          cp -r browser_runtime minigames ballattax test ide _site/
          cp serviceworker.js arcamini_api.md _site/
          printf '{"sha":"%s","builtAt":"%s"}\n' \
            "$(git rev-parse --short HEAD)" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > _site/build_info.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
