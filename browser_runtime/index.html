	<style type="text/css">
body {
	margin: 0;
	-webkit-text-size-adjust: 100%;
	background: black;
	touch-action: none;
}
#arcamini_screens {
	width: 100vw;
	height: 100vh;
	overflow: hidden;
}
#arcamini_load {
	width: 100%;
	height: 100%;
	display:flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	font-family: monospace;
	font-size: 20px;
	color: white;
	background: #222;
}
#arcamini_load_icon_container {
	display:grid;
	cursor:pointer;
}
#arcamini_load_icon_container > * {
	grid-column:1;
	grid-row:1;
}
#arcamini_load_icon {
	width: 96px;
	height:	96px;
}
.fade_in {
	animation: fadeIn 3.0s linear infinite;
}
@keyframes fadeIn {
	0% { opacity: 0; }
	30% { opacity: 0; }
	50% { opacity: 0.8; }
	70% { opacity: 0; }
	100% { opacity: 0; }
}
#arcamini_load > div {
	padding:0.5em;
	cursor:pointer;
}
#arcamini_canvas {
	width: 100%;
	height: 100%;
}
	</style>

><script type="text/javascript"> // TEMPORARY: on-device error/console overlay for debugging iPad Safari,
// which has no accessible devtools without a tethered Mac. Remove once the
// underlying issue is diagnosed. Installed before graphicsGL.js/audio.js/
// app.js so it catches even early load failures.
(function() {
	const box = document.createElement('div');
	box.id = 'arcamini_debug_overlay';
	Object.assign(box.style, {
		position: 'fixed', left: '0', right: '0', bottom: '0', maxHeight: '45vh',
		overflowY: 'auto', margin: '0', padding: '0.5em',
		font: '11px/1.4 monospace', color: '#0f0', background: 'rgba(0,0,0,0.85)',
		whiteSpace: 'pre-wrap', wordBreak: 'break-word', zIndex: 999999, display: 'none',
		boxSizing: 'border-box', borderTop: '1px solid #0f0'
	});
	document.body.appendChild(box);

	const tab = document.createElement('div');
	tab.textContent = 'debug';
	Object.assign(tab.style, {
		position: 'fixed', right: '0', bottom: '0', padding: '0.3em 0.6em',
		font: '11px monospace', color: '#0f0', background: 'rgba(0,0,0,0.6)',
		zIndex: 1000000, cursor: 'pointer', display: 'none'
	});
	tab.addEventListener('click', ()=>{
		box.style.display = box.style.display === 'none' ? 'block' : 'none';
	});
	document.body.appendChild(tab);

	function fmt(a) {
		if(a instanceof Error) return a.message + (a.stack ? '\n' + a.stack : '');
		if(typeof a === 'string') return a;
		try { return JSON.stringify(a); } catch(e) { return String(a); }
	}
	function log(kind, args) {
		const line = document.createElement('div');
		if(kind === 'error') line.style.color = '#f66';
		else if(kind === 'warn') line.style.color = '#fd6';
		line.textContent = '[' + kind + '] ' + args.map(fmt).join(' ');
		box.appendChild(line);
		box.scrollTop = box.scrollHeight;
		tab.style.display = 'block';
		if(kind === 'error')
			box.style.display = 'block';
	}

	['log', 'warn', 'error', 'info'].forEach((kind)=>{
		const orig = console[kind];
		console[kind] = function(...args) {
			log(kind, args);
			orig.apply(console, args);
		};
	});

	window.addEventListener('error', (evt)=>{
		log('error', [evt.message + ' @ ' + evt.filename + ':' + evt.lineno, (evt.error && evt.error.stack) || '']);
	});
	window.addEventListener('unhandledrejection', (evt)=>{
		log('error', ['Unhandled promise rejection:', (evt.reason && evt.reason.stack) || evt.reason]);
	});
})();
</script>
<script type="text/javascript" src="graphicsGL.js"></script>
<script type="text/javascript" src="audio.js"></script>
<script type="text/javascript" src="app.js"></script>
<script type="text/javascript">
// ?game=<relative-dir>/ lets this runtime boot an example that lives
// elsewhere in the arcamini repo (e.g. ../ballattax/) instead of the
// manifest/scripts bundled alongside this index.html, without duplicating
// its files: every relative fetch/import/resource load below resolves
// against <base>, so pointing it at another directory is enough.
// ?manifest=<filename> and ?script=<filename> override the manifest's own
// filename and boot script, for directories that hold more than one example.
const runtimeParams = new URLSearchParams(location.search);
const gameDir = runtimeParams.get('game') || './';
const manifestFile = runtimeParams.get('manifest') || 'manifest.json';
document.getElementById('arcamini_base').href = new URL(gameDir, location.href).href;

fetch(manifestFile).then(resp=>resp.json()).then((data)=>{
	function iconByType(data, type) {
		if(data.icons && Array.isArray(data.icons)) {
			for(let i=0; i<data.icons.length; ++i) {
				const record = data.icons[i];
				if(record.src && record.src.toLowerCase().endsWith(type))
					return record.src;
			}
		}
		if(data.icon && data.icon.toLowerCase().endsWith(type))
			return data.icon;
		return null;
	}

	if(data.name) {
		document.title = data.name;
		document.querySelector("#arcamini_load_title").innerHTML = data.name;
	}

	{
		const favicon = document.querySelector("link[rel~='icon']");
		const appleTouchIcon = document.querySelector("link[rel~='apple-touch-icon']");
		const loadicon = document.querySelector("#arcamini_load_icon");
		const svgIcon = iconByType(data, 'svg'), pngIcon = iconByType(data, 'png'), anyIcon = svgIcon || pngIcon;
		if(!anyIcon)
			favicon.href = loadicon.src;
		else {
			favicon.href = loadicon.src = anyIcon;
			if(pngIcon)
				appleTouchIcon.href = pngIcon;
		}
	}

	document.querySelector("#arcamini_start_icon").style.display = '';
	document.querySelector("#arcamini_start_icon").classList.add("fade_in");

	function launch() {
		if(data.display === 'fullscreen')
			app.fullscreen(true);
		arcamini.audio.resume();
		document.getElementById('arcamini_load').style.display = 'none';
		app._boot(runtimeParams.get('script') || data.scripts[0], app.args);
	}
	document.getElementById('arcamini_load').addEventListener("click", launch);

	function pollGamepads(now) {
		for(let i=0; i<2; ++i) {
			const state = app._getGamepad(i);
			if(state.connected && state.buttons.length && state.buttons[0])
				return launch();
		}
		requestAnimationFrame(pollGamepads);
	}
	requestAnimationFrame(pollGamepads);
}).catch(err => alert("this app needs to be provided by a web server"));
</script
